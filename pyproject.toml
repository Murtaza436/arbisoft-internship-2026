[project]
name = "week3-rag"
version = "0.1.0"
description = "Week 3 - RAG, Vector DBs and Structured Outputs"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "jupyter>=1.1.1",
    "notebook>=7.6.0",
    "openai>=2.44.0",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
