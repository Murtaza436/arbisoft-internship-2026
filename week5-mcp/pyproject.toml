[project]
name = "week5-mcp"
version = "0.1.0"
description = "Week 5 - MCP, Multi-Agent Orchestration"
requires-python = ">=3.11"
dependencies = [
    "jupyter>=1.1.1",
    "mcp>=1.28.1",
    "notebook>=7.6.0",
    "openai>=2.46.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
